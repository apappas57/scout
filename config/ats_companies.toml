# Scout ATS company registry
#
# WHY THIS FILE EXISTS
# --------------------
# scout/discover.py asks an LLM with web access to find roles. That only ever surfaces what
# is *indexed*, which is the same pool already sitting on Seek and LinkedIn by the time it is
# crawlable. Roles appear on a company's own applicant tracking system days-to-weeks earlier,
# and many AU-eligible remote roles never get syndicated at all. This registry is the list of
# boards to poll directly, so Scout sees the long tail nobody else is looking at.
#
# Every slug below was probed live and returned HTTP 200 with at least one real posting on
# 2026-08-02. Entries that 404'd were discarded rather than left in, because a dead slug costs
# a network round trip on every weekly run forever and teaches you nothing.
#
# HOW TO ADD A COMPANY
# --------------------
# 1. Find the slug. Open the company's careers page and look at where the "apply" links point:
#
#      jobs.ashbyhq.com/<slug>              -> board = "ashby"
#      boards.greenhouse.io/<slug>          -> board = "greenhouse"
#      job-boards.greenhouse.io/<slug>      -> board = "greenhouse"
#      jobs.lever.co/<slug>                 -> board = "lever"
#      careers.smartrecruiters.com/<slug>   -> board = "smartrecruiters"
#
#    Workable is NOT a supported board. Its public widget endpoint either 404s or answers 200
#    with an empty jobs array, which reads as "this company is not hiring" and is worse than
#    no board at all. If a company's only board is Workable, leave it in the rejected list at
#    the bottom of this file rather than adding a row that silently returns nothing.
#
#    If the careers page is JavaScript-rendered and shows no such link, grep the page source
#    for "greenhouse", "ashby", "lever" or "boardToken". Glean, for example, hides its token in
#    a JS variable (company = "gleanwork"). Heidi Health's Ashby slug is literally
#    "heidihealth.com.au", so never assume the slug is just the lowercased company name.
#
# 2. Verify it BEFORE adding it. Curl the endpoint and confirm 200 plus a non-empty job list:
#
#      curl -s "https://boards-api.greenhouse.io/v1/boards/<slug>/jobs" | head -c 300
#      curl -s "https://api.ashbyhq.com/posting-api/job-board/<slug>" | head -c 300
#      curl -s "https://api.lever.co/v0/postings/<slug>?mode=json" | head -c 300
#      curl -s "https://api.smartrecruiters.com/v1/companies/<slug>/postings" | head -c 300
#
#    Or use the helper, which returns (ok, posting_count, note) and only says ok on a 200 in
#    the right shape with a non-zero count:
#
#      .venv/bin/python -c "from scout.ats import verify_slug; print(verify_slug('greenhouse', 'anthropic'))"
#
#    A 200 with zero jobs is not proof. Check the titles too: several obvious-looking slugs
#    belong to a completely different company ("greenhouse/athena" is a household staffing
#    agency, "greenhouse/ultimate" is an HVAC contractor, "greenhouse/peak" is a physiotherapy
#    chain). Those were all rejected here.
#
# 3. Add the block, set verified to the date you checked, and put the evidence in note.
#
# WHAT BELONGS HERE
# -----------------
# A company earns a place only if it plausibly hires an applied-AI / forward-deployed /
# AI-solutions / AI-native engineer AND there is a real path to an Australia-eligible or
# genuinely global-remote role. Companies whose entire posting history is US-only or EMEA-only
# were left out on purpose: the filter stage would reject their roles anyway, so carrying them
# is pure cost. Breadth is the point, padding is not.
#
# The note field records the AU / APAC / remote evidence actually observed at verification
# time. Posting mixes change, so treat notes as a reason the company is on the list, not as a
# promise about what is open this week.

# ---------------------------------------------------------------------------
# Australia / New Zealand headquartered or with a standing AU office.
# Highest-value section: lowest application volume, most likely AU-eligible.
# ---------------------------------------------------------------------------

